name: Phase 3 Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: TypeScript + Build + Phase 3 Checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect repository
        run: |
          echo "=== Repository ==="
          pwd
          echo "=== Root ==="
          ls -la

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          echo "=== Installing dependencies ==="
          npm install --no-audit --no-fund

      - name: TypeScript check
        run: |
          echo "=== TypeScript check ==="
          npm run typecheck

      - name: Production build
        run: |
          echo "=== Production build ==="
          npm run build

      - name: Phase 3 checks
        shell: bash
        run: |
          echo "========================================"
          echo "PHASE 3 STATIC CHECKS"
          echo "========================================"

          FAILED=0

          echo ""
          echo "--- Required files ---"

          FILES=(
            "src/features/auth/AuthContext.tsx"
            "src/components/auth/ProtectedRoute.tsx"
            "src/components/auth/RoleGuard.tsx"
            "src/pages/LoginPage.tsx"
            "src/pages/SignupPage.tsx"
            "src/services/auth.service.ts"
            "src/utils/auth-errors.ts"
            "src/utils/safe-redirect.ts"
          )

          for FILE in "${FILES[@]}"; do
            if [ -f "$FILE" ]; then
              echo "PASS: $FILE"
            else
              echo "FAIL: Missing $FILE"
              FAILED=1
            fi
          done

          echo ""
          echo "--- RoleGuard checks ---"

          ROLE_GUARD="src/components/auth/RoleGuard.tsx"

          if grep -Fq "allowed.includes(role)" "$ROLE_GUARD"; then
            echo "PASS: RoleGuard uses explicit role matching"
          else
            echo "FAIL: RoleGuard does not contain allowed.includes(role)"
            FAILED=1
          fi

          if grep -Fq "effectiveAllowed" "$ROLE_GUARD"; then
            echo "FAIL: Implicit admin-to-agent expansion detected"
            FAILED=1
          else
            echo "PASS: No implicit admin-to-agent expansion"
          fi

          echo ""
          echo "--- AuthContext checks ---"

          AUTH_CONTEXT="src/features/auth/AuthContext.tsx"

          if grep -Fq "role === 'agent'" "$AUTH_CONTEXT"; then
            echo "PASS: isAgent is strict"
          else
            echo "FAIL: Strict agent role check not found"
            FAILED=1
          fi

          if grep -Fq "profileRequestIdRef" "$AUTH_CONTEXT"; then
            echo "PASS: Profile request generation protection exists"
          else
            echo "FAIL: Profile request generation protection not found"
            FAILED=1
          fi

          echo ""
          echo "========================================"

          if [ "$FAILED" -ne 0 ]; then
            echo "PHASE 3 CHECKS FAILED"
            exit 1
          fi

          echo "PHASE 3 CHECKS PASSED"
          echo "========================================"