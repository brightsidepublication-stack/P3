name: Phase 3 Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: TypeScript + Build + Phase 3 Static Checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect repository
        run: |
          echo "=== Current directory ==="
          pwd

          echo "=== Root files ==="
          ls -la

          echo "=== package.json check ==="
          if [ -f package.json ]; then
            echo "package.json FOUND"
            cat package.json
          else
            echo "ERROR: package.json NOT FOUND"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: |
          echo "=== Installing dependencies ==="
          npm install --no-audit --no-fund --verbose

      - name: TypeScript check
        run: |
          npm run typecheck

      - name: Production build
        run: |
          npm run build

      - name: Phase 3 static verification
        run: |
          echo "=== Phase 3 static verification ==="
          echo "=== Verification script ==="

          if [ -f scripts/verify-phase3.mjs ]; then
            sed -n '1,260p' scripts/verify-phase3.mjs
          else
            echo "ERROR: scripts/verify-phase3.mjs NOT FOUND"
            exit 1
          fi

          echo "=== Running verification ==="

          set +e
          node scripts/verify-phase3.mjs 2>&1
          STATUS=$?
          set -e

          echo "=== Verification exit code: $STATUS ==="

          if [ "$STATUS" -ne 0 ]; then
            echo "=== Phase 3 static verification FAILED ==="
            exit "$STATUS"
          fi

          echo "=== Phase 3 static verification PASSED ==="