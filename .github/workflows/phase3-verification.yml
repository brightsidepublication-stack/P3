name: Phase 3 Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: TypeScript + Build + Phase 3 Checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect repository
        run: |
          echo "=== Repository ==="
          pwd
          echo "=== Root files ==="
          ls -la

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          echo "=== Installing dependencies ==="
          npm install --no-audit --no-fund

      - name: TypeScript check
        run: |
          echo "=== TypeScript check ==="
          npm run typecheck

      - name: Production build
        run: |
          echo "=== Production build ==="
          npm run build

      - name: Phase 3 checks
        run: |
          echo "=== PHASE 3 CHECKS START ==="

          echo "--- Required files ---"

          test -f src/features/auth/AuthContext.tsx
          echo "PASS: AuthContext"

          test -f src/components/auth/ProtectedRoute.tsx
          echo "PASS: ProtectedRoute"

          test -f src/components/auth/RoleGuard.tsx
          echo "PASS: RoleGuard"

          test -f src/pages/LoginPage.tsx
          echo "PASS: LoginPage"

          test -f src/pages/SignupPage.tsx
          echo "PASS: SignupPage"

          test -f src/services/auth.service.ts
          echo "PASS: auth.service"

          test -f src/utils/auth-errors.ts
          echo "PASS: auth-errors"

          test -f src/utils/safe-redirect.ts
          echo "PASS: safe-redirect"

          echo "--- RoleGuard ---"

          grep -F "allowed.includes(role)" src/components/auth/RoleGuard.tsx
          echo "PASS: explicit role matching"

          if grep -Fq "effectiveAllowed" src/components/auth/RoleGuard.tsx; then
            echo "FAIL: implicit admin-to-agent expansion detected"
            exit 1
          fi

          echo "PASS: no implicit admin-to-agent expansion"

          echo "--- AuthContext ---"

          grep -F "role === 'agent'" src/features/auth/AuthContext.tsx
          echo "PASS: strict agent role"

          grep -F "profileRequestIdRef" src/features/auth/AuthContext.tsx
          echo "PASS: profile request generation protection"

          echo "=== PHASE 3 CHECKS PASSED ==="